  utter_about_us_hi:
    - text: >
        हम Victories Over Dreams से हैं, जो हमारी शिक्षा प्रणाली में मौजूद खाई और चुनौतियों को पाटने का प्रयास कर रहे हैं।

        हम क्या बना रहे हैं:
        - Life Navigator Tools — आत्म-विकास (self-improvement) पर आधारित डिजिटल उत्पाद → हम यहीं हैं!
        - Micro-Workshop Programs, जो soft skills और अनुभव-आधारित (experiential) शिक्षा पर केंद्रित हैं → यह हमारा दीर्घकालिक विज़न है
        - EntreHub — एक उद्यमिता हब, जो बिज़नेस बिल्डिंग को बढ़ावा देता है → दीर्घकालिक विज़न का हिस्सा
        - Micro और Mega Learning Centers, जो शिक्षा और उद्यमिता से जुड़ी सुविधाएं देते हैं, साथ ही "Earn & Learn" जैसी योजनाएं → दीर्घकालिक दृष्टिकोण के तहत

        इन सभी प्रयासों को एकीकृत (integrate) कर रहे हैं ताकि ठोस परिणाम मिलें, शिक्षा की कुल लागत घटे और सामाजिक समस्याएं भी कम हों।

        हमारा विज़न:
        - हम शिक्षा में एक क्रांति लाना चाहते हैं — ऐसा सिस्टम जो उद्यमिता सोच को पोषित करे, critical thinking को तेज़ करे, और skill-based, practical learning को modern tools के ज़रिए सिखाए। हमारा उद्देश्य है कि अगली पीढ़ी को global स्तर पर agile और impactful बनाया जाए।

        हमारा मिशन:
        - हम ऐसे future-ready minds को empower करना चाहते हैं जो innovation, entrepreneurship और real-world learning के ज़रिए शिक्षा को फिर से परिभाषित करें — जिससे यह accessible, practical और effective बन सके।
        - जहां education और technology मिलते हैं और ideas actions में बदलते हैं — वहीं से एक smart future की शुरुआत होती है।
        - एक community, एक skill, एक tool, एक mind — एक समय में।

        अधिक जानकारी के लिए, संस्थापक का संदेश इस पेज पर देखें:
        👉 https://www.victoriesoverdreams.com/about-us

        व्यक्तिगत छूट पाने के लिए FOUR टाइप करें!

