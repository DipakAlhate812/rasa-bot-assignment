  utter_foundational_block_tour_hi:
    - text: |
        LifeNavigator प्लेटफ़ॉर्म एक ऐसा टूलसेट है जो व्यक्तिगत विकास को केंद्र में रखकर बनाया गया है। हमारा मानना है कि ज़िंदगी एक सतत विकास की यात्रा है — और यही सोच इस प्लेटफ़ॉर्म के पीछे की प्रेरणा है।

        यह टूल आपको चार मुख्य जीवन क्षेत्रों में ग्रोथ करने में मदद करता है — जहाँ आप core qualities को master करते हैं, real-life skills बनाते हैं, और अपने purpose के साथ alignment लाते हैं।
        
        LifeNavigator के चार स्तंभ (जिसे हम #2F2P भी कहते हैं):
          - Fitness — Physical wellness और discipline;
          - Professional — Career growth और excellence;
          - Personal — Emotional strength और self-awareness;
          - Financial — Wealth mindset और decision-making skills;
        
        Core Skills और Qualities (6 मुख्य themes):
          - Mindset और दृष्टिकोण;
          - Work ethic और discipline;
          - Communication और leadership;
          - Learning और adaptability;
          - Vision और purpose;
          - Financial risk management;

        “Zindagi ek निरंतर growth की यात्रा है — जिज्ञासा self-discovery को fuel देती है, और अनुभव आपके उद्देश्य के रास्ते को आकार देते हैं।”

        Quick Tour Video देखने के लिए क्लिक करें:
         - https://www.youtube.com/watch?v=BKBt33Jcpe4

         - Life Navigator टूल का टूर शुरू करने के लिए 'TWO' टाइप करें!

  utter_lifenavigator_platform_tour_hi:
    - text: |
        🧭 LifeNavigator प्लेटफ़ॉर्म – Quick Tour of the Productivity Wheel
        
        🎯 केंद्र में:
        - Dashboard & Monitoring
        यह आपका central control hub है — जहाँ आप अपनी life और productivity के हर पहलू को track, visualize और अपने goals के साथ align कर सकते हैं।

        - चारों ओर फैले हुए 8 मॉड्यूल्स:

        - Entrepreneurship
        Apne business ideas को structured tools की मदद से बनाएं और grow करें।

        - Planners, Trackers & Organizers
        Daily/Weekly planners, goal trackers और organizers जो आपको track पर बनाए रखते हैं।

        - Retrospection
        Apni progress पर सोचें, analyze करें और key insights निकालें।

        - Learning & Upskilling
        Curated learning resources और growth-focused learning paths।

        - Decision-Making Tools
        Confident और clear decisions लेने के लिए guided frameworks।

        - Office Buddy
        Aapka digital accountability partner — focus और task management के लिए।

        - Financial Planning
        Apne पैसे, goals, savings और investments को manage करने के tools।

        - Health & Fitness
        Apne workouts, wellness और health goals को track करें।

        - यह पूरा Productivity Wheel एक 360° life management experience देता है — जहाँ सब कुछ एक unified dashboard से monitor किया जा सकता है।

        - Kya aap kisi module ko और गहराई से explore करना चाहते हैं?
        - Quick Tour Video देखें: https://www.youtube.com/watch?v=bevV7bwwt7E

        - Tools ke vision ke बारे में और जानने के लिए 'THREE' टाइप करें!

