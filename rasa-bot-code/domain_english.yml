  utter_foundational_block_tour:
    - text: |
        LifeNavigator platform is a set of tools specifically crafted for individual focusing on self-development built around the idea that life is a journey of continuous growth. It helps you grow across four essential life domains — by mastering key traits, building real-life skills, and aligning with your purpose.

        🔹 The Four Pillars of LifeNavigator (#2F2P):
        - 🏋️ Fitness — Physical wellness & discipline  
        - 💼 Professional — Career growth & excellence  
        - 🧍 Personal — Emotional strength & self-awareness  
        - 💰 Financial — Wealth mindset & decision making  

        🔹 Core Skills & Traits (6 themes):
        - Mindset & Attitude
        - Work Ethics & Discipline
        - Communication & Leadership
        - Learning & Adaptability
        - Vision & Purpose
        - Financial Risk Management

        🔮 “Life is a journey of continuous growth—curiosity fuels self-discovery, and experiences shape the path to purpose.”

        🎥 Watch the Quick Tour Video: (https://www.youtube.com/watch?v=BKBt33Jcpe4)

        Type TWO for Life Navigator Tool Tour!
    
  utter_lifenavigator_platform_tour:
    - text: |
        🧭 LifeNavigator Platform – Productivity Wheel Quick Tour

        At the center:
        🧩 Dashboard & Monitoring
        Your central control hub — where all aspects of life and productivity are tracked, visualized, and aligned with your goals.

        🔄 Surrounding Modules:

        1. 📈 Entrepreneurship  
        Build and grow your business ideas with structured tools.

        2. 🗂️ Planners, Trackers, Organizers  
        Daily/weekly planners, goal trackers, and productivity organizers to keep you on track.

        3. 🔁 Retrospection  
        Reflect on your progress and extract key insights from your actions.

        4. 🎓 Learning & Upskilling  
        Curated resources and learning paths to continuously grow.

        5. 🧠 Decision Making Tools  
        Make confident and clear decisions using guided frameworks.

        6. 🤝 Office Buddy 
        Your digital accountability partner for daily focus and task management.

        7. 💰 Financial Planning 
        Tools for managing your money, goals, savings, and investments.

        8. 💪 Health & Fitness 
        Track your physical wellness, workouts, and health goals.

        🔹 This productivity wheel provides a 360° life management experience — with everything monitored from a unified dashboard.

        👉 Ready to explore a module in depth?
        🎥 Watch the Quick Tour Video: (https://www.youtube.com/watch?v=bevV7bwwt7E)

        Type THREE for Knowing More About Tools Vision!
    
