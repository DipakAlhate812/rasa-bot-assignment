  utter_about_us:
    - text: >
        We are from Victories Over Dreams working on bridging gap and challenges of our education system. 
        

        What we are building:
        - Life Navigator Tools — Digital Products on self improvement >> We are here!
        - Micro-workshops programmes on Soft Skills and Experience-Based Learning >> Long term vision
        - Entrepreneurship Hub — EntraHub to foster business creation >> Long term vision
        - Micro and Mega Learning Centres providing educational and entrepreneurial facilities with Earn and Learn schemes >> Long term vision
        - Integrating Everything to drive results; and reduce overall educational cost and reduce societal problems >> Long term vision
        

        Our Vision:
            We aim to revolutionize education by nurturing entrepreneurial mindsets, sharpening critical thinking, and enabling skill-based, practical learning through modern tools—preparing the next generation to thrive globally with agility and impact.
        
        Our Mission:
            We empower future-ready minds by reshaping education through innovation, entrepreneurship, and real-world learning—making it accessible, practical, and impactful. Where learning meets technology and ideas turn into action, we’re building a smarter future—one community, one skill, one tool, one mind at a time.

        Additionally you can check founders message on following page. (https://www.victoriesoverdreams.com/about-us)

        Type FOUR for grabbing personal discount!


