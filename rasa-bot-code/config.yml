# The config recipe.
# https://rasa.com/docs/rasa/model-configuration/
recipe: default.v1

# The assistant project unique identifier
# This default value must be replaced with a unique assistant name within your deployment
assistant_id: 20250412-162704-best-deliverable

# Default language for your bot
language: "en"  # This is the primary language (can also be set dynamically based on user input)

policies:
  - name: MemoizationPolicy
    max_history: 5
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true

pipeline:
  # Preprocessing the text and tokenizing it
  - name: "WhitespaceTokenizer"  # Tokenizer to split text into individual tokens based on whitespace

  # Convert tokens into embeddings
  - name: "CountVectorsFeaturizer"  # Converts words to numerical features (based on frequency)

  # A pre-trained transformer model for handling intents and entities
  - name: "DIETClassifier"  # A transformer-based intent and entity recognition model (usually recommended for performance)
    epochs: 100  # Number of training epochs (adjustable based on dataset size)
    constrain_similarities: true  # Constrain the classifier to handle intent similarity better

  # For entity extraction, if required
  - name: "EntitySynonymMapper"  # Helps in mapping different variations of the same entity
  
  # Dialogue handling (message passing, prediction)
  - name: "ResponseSelector"  # Response Selector to provide responses based on intent
    epochs: 100  # Number of epochs for training
  
  # Follow-up actions based on dialogue predictions
  - name: "FallbackClassifier"
    threshold: 0.3  # When the confidence level is below 30%, fall back to a default action

  # Multilingual Support - Add a multilingual NLU pipeline component
  - name: "LanguageModelFeaturizer"  # Use this to support both languages
    model_name: "bert"  # Pretrained multilingual transformer model (supports both English & Hindi)
  
  # Additional preprocessing or classifiers for multilingual support (optional)
  - name: "DIETClassifier"  # Fine-tune DIETClassifier for both languages
    epochs: 100
    constrain_similarities: true  # Helps with language-agnostic intent detection