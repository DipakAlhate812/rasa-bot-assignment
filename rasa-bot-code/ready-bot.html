<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Access the App</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #444;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    h2 {
      font-size: 18px;
      margin: 10px 0;
      color: #555;
    }
    ol {
      text-align: left;
      font-size: 16px;
      color: #333;
    }
    .highlight {
      color: #2196F3;
      font-weight: bold;
    }
    .instructions {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 80%;
      max-width: 400px;
      margin-top: 20px;
    }
    .button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .button:hover {
      background-color: #1976D2;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Application</h1>
  <div class="instructions">
    <h2>Follow these steps to get started:</h2>
    <ol>
      <li>Copy the URL: <span class="highlight">http://localhost:5044</span></li>
      <li>Open your <strong>Google Chrome</strong> browser. It works best in Google Chrome.</li>
      <li>Paste the URL in the address bar and press <strong>Enter</strong>.</li>
      <li>Start using the bot!</li>
    </ol>
    <button class="button" onclick="copyToClipboard()">Copy URL to Clipboard</button>
</div>
<script>
    function copyToClipboard() {
      var url = "http://localhost:5044";
      var textarea = document.createElement("textarea");
      textarea.value = url;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);
      alert("URL copied to clipboard: " + url);
    }
  </script>
</body>
</html>
